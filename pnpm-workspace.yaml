    peerDependencies:
      '@afm/engine': '0.0.0'
  '@afm/adapter-secret@0.0.0':
    peerDependencies:
      '@afm/engine': '0.0.0'
  '@afm/adapter-tool@0.0.0':
    peerDependencies:
      '@afm/engine': '0.0.0'
      '@afm/adapter-auth': '0.0.0'
blockExoticSubdeps: true
